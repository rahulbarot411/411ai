<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>AI System</title><style>body{margin:0;background:#111;color:#eee;font-family:Inter,Arial}.wrap{display:flex;height:100vh}.side{width:240px;border-right:1px solid #333;padding:12px}.main{flex:1;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:16px}.msg{margin:8px 0;padding:10px;border-radius:8px;background:#1b1b1b}textarea{width:100%;height:80px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:8px;padding:10px}button{margin-top:8px;padding:8px 12px;background:#444;color:#fff;border:0;border-radius:6px}</style></head><body><div id='root'></div><script crossorigin src='https://unpkg.com/react@18/umd/react.production.min.js'></script><script crossorigin src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'></script><script>
const e = React.createElement;
function App(){const [sid,setSid]=React.useState('');const [input,setInput]=React.useState('');const [msgs,setMsgs]=React.useState([]);
async function send(){setMsgs(m=>[...m,{r:'user',t:input},{r:'assistant',t:''}]);const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid||null,message:input})});const nsid=res.headers.get('x-session-id');if(!sid&&nsid) setSid(nsid);const rd=res.body.getReader();const dec=new TextDecoder();let buf='';while(true){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});for(const part of buf.split('\n\n')){if(!part.startsWith('data: '))continue;try{const obj=JSON.parse(part.slice(6));if(obj.delta){setMsgs(m=>{const n=[...m];n[n.length-1]={r:'assistant',t:(n[n.length-1].t||'')+obj.delta};return n;});}}catch{}}buf='';}setInput('');}
return e('div',{className:'wrap'},e('div',{className:'side'},e('h3',null,'Sessions'),e('div',null,sid||'new')),e('div',{className:'main'},e('div',{className:'msgs'},msgs.map((m,i)=>e('div',{key:i,className:'msg'},e('b',null,m.r+': '),m.t))),e('div',{style:{padding:'12px'}},e('textarea',{value:input,onChange:x=>setInput(x.target.value)}),e('button',{onClick:send},'Send'))));}
ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script></body></html>
